<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Văn hóa 360° - An Giang</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@0.13/build/pannellum.css" />
    <script src="https://cdn.jsdelivr.net/npm/pannellum@0.13/build/pannellum.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #f8f9fa, #e6f2ff);
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }

        h2,
        h3 {
            text-align: center;
            color: #c62828;
            /* Đỏ miền Tây */
            margin: 30px 0 20px;
        }

        h2 {
            font-size: 2.5rem;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }

        h3 {
            font-size: 1.8rem;
        }

        #panorama-container {
            max-width: 1200px;
            margin: 0 auto 40px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        #panorama2 {
            width: 100%;
            height: 60vh;
            min-height: 500px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transition: all 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
        }

        .thumbnail {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 4px solid #d32f2f;
        }

        .info {
            padding: 20px;
            text-align: center;
        }

        .info h4 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #b71c1c;
        }

        .info p {
            font-size: 1rem;
            color: #555;
            margin-bottom: 15px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            /* 16:9 */
            height: 0;
            overflow: hidden;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            #panorama2 {
                height: 50vh;
            }
        }
    </style>
</head>

<body>

    <h2>Văn hóa & Lễ hội An Giang - Khám phá 360°</h2>

    <div id="panorama-container">
        <h3>Khám phá Văn hóa An Giang qua ảnh 360°</h3>
        <div id="panorama2"></div>
    </div>

    <div class="gallery">
        <!-- Sử dụng th:each để lặp qua danh sách văn hóa -->
        <div class="card" th:each="item : ${cultures}">
            <!-- Ảnh thumbnail -->
            <a th:href="@{/tour3d/culture/{id}(id=${item.id})}">
                <img th:src="@{${item.thumbnail}}" th:alt="${item.title}" class="thumbnail">
            </a>

            <div class="info">
                <!-- Tiêu đề có link -->
                <h4>
                    <a th:href="@{/tour3d/culture/{id}(id=${item.id})}" th:text="${item.title}"
                        style="text-decoration: none; color: #b71c1c;">
                        Tiêu đề văn hóa
                    </a>
                </h4>
                <!-- Mô tả ngắn -->
                <p th:text="${item.shortDescription}">Mô tả ngắn về văn hóa...</p>
            </div>

            <!-- Video -->
            <div class="video-wrapper">
                <iframe th:src="${item.videoUrl}" th:title="${item.title}" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen loading="lazy"></iframe>
            </div>

            <!-- Nút xem chi tiết -->
            <div style="text-align: center; padding-bottom: 20px;">
                <a th:href="@{/tour3d/culture/{id}(id=${item.id})}"
                    style="display: inline-block; padding: 8px 20px; background-color: #d32f2f; color: white; text-decoration: none; border-radius: 20px; font-weight: bold; transition: background 0.3s;">
                    Xem chi tiết
                </a>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo Pannellum 360°
        pannellum.viewer('panorama2', {
            "type": "equirectangular",
            "panorama": "/image/test.jpg",
            "autoLoad": true,
            "autoRotate": -1.5,
            "autoRotateInactivityDelay": 3000,
            "compass": true
        });
    </script>

</body>

</html>
